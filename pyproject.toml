[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanized-selenium-scraper"
version = "0.1.0"
description = "Human-like Google searching and subpage search via Selenium."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["selenium>=4.10,<5"]
