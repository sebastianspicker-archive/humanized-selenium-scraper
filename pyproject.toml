[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanized-selenium-scraper"
version = "0.1.0"
description = "Human-like Google searching and subpage search via Selenium."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["selenium>=4.10,<5"]

[project.optional-dependencies]
# Dev tools are pinned exactly: they gate CI (ruff formatting/lint, mypy, tests,
# bandit, pip-audit), so an unpinned upgrade must not turn the gate red. Bump a
# pin deliberately, re-run `make ci security dependency-audit`, and commit.
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["chrome_profile", "scraper.log", "input.csv", "output.csv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
